<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>比較表檢視</title>
<style>
:root{--navy:#163b63;--blue:#27649a;--ink:#203044;--muted:#6b7b8d;--line:#dce5ee;--bg:#f3f6fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
header{background:linear-gradient(125deg,#163b63,#3476a9);color:#fff;padding:22px 16px}.wrap{width:min(100% - 28px,1000px);margin:auto}
header a{color:#e5eef8;text-decoration:none;font-size:13px}h1{font-size:22px;margin:12px 0 0}
main{padding:20px 0 34px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:0 6px 20px rgba(20,48,78,.04)}
.stage{min-height:48vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;border-radius:10px;overflow:hidden}
.stage img{display:block;max-width:100%;max-height:72vh;object-fit:contain}
.controls{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:14px}
button{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:11px 19px;font-weight:800;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}.counter{font-size:13px;color:var(--muted);min-width:90px;text-align:center}
.thumbs{display:flex;gap:8px;overflow:auto;padding:12px 2px 2px}.thumbs button{background:#f2f6fa;border:2px solid transparent;padding:3px;flex:none}
.thumbs button.active{border-color:var(--blue)}.thumbs img{width:76px;height:58px;object-fit:contain;display:block}
.status{color:var(--muted);text-align:center;padding:30px 12px;font-size:14px}
@media(max-width:600px){.stage{min-height:38vh}.stage img{max-height:65vh}.panel{padding:8px}}
</style>

<script src="../update.js" defer></script>
</head>
<body>
<header><div class="wrap"><a href="../">← 返回各式比較表</a><h1 id="title">比較表檢視</h1></div></header>
<main class="wrap"><section class="panel">
<div class="stage" id="stage"><div class="status" id="status">正在載入比較表…</div><img id="mainImage" alt="" hidden></div>
<div class="controls"><button id="prev">上一張</button><span class="counter" id="counter">- / -</span><button id="next">下一張</button></div>
<div class="thumbs" id="thumbs"></div>
</section></main>
<script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{
const params=new URLSearchParams(location.search),title=$('title'),img=$('mainImage'),status=$('status'),counter=$('counter'),prev=$('prev'),next=$('next'),thumbs=$('thumbs');
function $(id){return document.getElementById(id)}
let images=[],index=0;
function draw(){
 if(!images.length)return;
 img.src=images[index].url;img.alt=images[index].alt||title.textContent;img.hidden=false;status.hidden=true;
 counter.textContent=`${index+1} / ${images.length}`;prev.disabled=index===0;next.disabled=index===images.length-1;
 [...thumbs.children].forEach((b,i)=>b.classList.toggle('active',i===index));
}
prev.onclick=()=>{if(index>0){index--;draw()}};
next.onclick=()=>{if(index<images.length-1){index++;draw()}};
async function init(){
 try{
  const cfg=window.SUPABASE_CONFIG||{};
  const sb=window.supabase&&cfg.url&&cfg.anonKey?window.supabase.createClient(cfg.url,cfg.anonKey):null;
  const legacy=params.get('legacy');
  if(legacy==='warm-heart'){
   title.textContent='新舊溫心大心比較表';
   images=[{url:'../assets/rider-comparisons/新舊溫心大心比較表.jpg'}];
  }else if(legacy==='accident'){
   title.textContent='意外險升級比較表';
   images=[1,2,3].map(n=>({url:`../assets/rider-comparisons/意外險升級比較表-${n}.jpg`}));
  }else{
   if(!sb)throw Error('尚未設定 Supabase 連線。');
   const id=params.get('id');if(!id)throw Error('找不到比較表編號。');
   const {data,error}=await sb.from('rider_comparisons').select('title,image_paths').eq('id',id).eq('is_active',true).single();
   if(error)throw error;
   title.textContent=data.title;
   images=(data.image_paths||[]).map(path=>({url:path.startsWith('legacy:')?'../'+path.slice(7):sb.storage.from('rider-comparisons').getPublicUrl(path).data.publicUrl}));
  }
  if(!images.length)throw Error('這個比較表尚未上傳圖片。');
  thumbs.innerHTML=images.length>1?images.map((x,i)=>`<button type="button" aria-label="第 ${i+1} 張圖片"><img src="${x.url}" alt=""></button>`).join(''):'';
  [...thumbs.children].forEach((b,i)=>b.onclick=()=>{index=i;draw()});
  draw();
 }catch(e){status.textContent='載入失敗：'+(e.message||e)}
}
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')prev.click();if(e.key==='ArrowRight')next.click()});
init();
})();
</script>
</body></html>
