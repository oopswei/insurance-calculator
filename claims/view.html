<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>理賠案例圖片</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#203044;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}.wrap{width:min(100% - 28px,1000px);margin:auto;padding:24px 0 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.back{color:#27649a;text-decoration:none;font-weight:700;font-size:13px}h1{font-size:22px;color:#163b63;margin:18px 0 4px}.muted{color:#6b7b8d;font-size:13px}.stage{margin-top:18px;background:white;border:1px solid #dce5ee;border-radius:14px;padding:12px;min-height:240px;display:flex;align-items:center;justify-content:center}.stage img{max-width:100%;max-height:76vh;object-fit:contain}.controls{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0}.btn{border:0;border-radius:8px;padding:10px 16px;background:#27649a;color:white;font-weight:700;cursor:pointer}.btn:disabled{opacity:.35;cursor:default}.thumbs{display:flex;gap:8px;overflow:auto;padding:4px 0}.thumbs button{border:2px solid transparent;background:white;padding:2px;border-radius:8px;flex:none}.thumbs button.active{border-color:#27649a}.thumbs img{width:76px;height:64px;object-fit:cover;display:block;border-radius:5px}.error{color:#b42318;margin-top:15px}
</style>
<script src="../update.js" defer></script>
</head><body><main class="wrap"><div class="top"><a class="back" href="../">← 返回保險試算中心</a><span class="muted" id="counter"></span></div><h1 id="title">理賠案例</h1><div class="muted" id="category"></div><div class="stage"><img id="mainImage" alt="理賠案例圖片" hidden></div><div class="controls"><button class="btn" id="prev">上一張</button><span class="muted" id="position"></span><button class="btn" id="next">下一張</button></div><div class="thumbs" id="thumbs"></div><p class="error" id="error"></p></main><script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{const $=id=>document.getElementById(id);try{const id=new URLSearchParams(location.search).get('id');if(!id)throw Error('缺少案例編號。');const cfg=window.SUPABASE_CONFIG||{};const sb=window.supabase.createClient(cfg.url,cfg.anonKey);const {data,error}=await sb.from('claims').select('*').eq('id',id).single();if(error)throw error;$('title').textContent=data.title;$('category').textContent=data.category;const urls=(data.image_paths||[]).map(p=>p.startsWith('legacy:')?'../'+p.slice(7):sb.storage.from('claims-images').getPublicUrl(p).data.publicUrl);if(!urls.length)throw Error('此案例尚未上傳圖片。');let index=0;function render(){ $('mainImage').src=urls[index];$('mainImage').hidden=false;$('position').textContent=`${index+1} / ${urls.length}`;$('counter').textContent=`共 ${urls.length} 張圖片`;$('prev').disabled=index===0;$('next').disabled=index===urls.length-1;[...$('thumbs').children].forEach((b,i)=>b.classList.toggle('active',i===index))}urls.forEach((u,i)=>{const b=document.createElement('button');const im=document.createElement('img');im.src=u;im.alt=`第 ${i+1} 張`;b.appendChild(im);b.onclick=()=>{index=i;render()};$('thumbs').appendChild(b)});$('prev').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index<urls.length-1){index++;render()}};render()}catch(e){$('error').textContent='讀取失敗：'+(e.message||String(e))}})();</script></body></html>
