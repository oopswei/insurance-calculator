<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>創世紀費率管理後台</title><style>
:root{--navy:#163b63;--blue:#27649a;--ink:#203044;--muted:#6b7b8d;--line:#dce5ee;--bg:#f3f6fa;--red:#b42318;--green:#16704a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}header{background:linear-gradient(125deg,#163b63,#3476a9);color:white;padding:25px 20px}.wrap{width:min(100% - 32px,900px);margin:auto}header a{color:#dcecff;text-decoration:none;font-size:13px}h1{font-size:25px;margin:12px 0 4px}main{padding:24px 0}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:15px}h2{margin:0 0 15px;color:var(--navy);font-size:18px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;height:42px;border:1px solid #cbd7e3;border-radius:8px;padding:0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:8px;background:var(--blue);color:white;font-weight:800;padding:11px 16px;cursor:pointer;margin:12px 8px 0 0}.btn.secondary{background:#eaf2fa;color:var(--navy)}.btn.danger{background:#fff0ef;color:var(--red)}.muted{font-size:12px;color:var(--muted);line-height:1.7}.msg{font-size:13px;margin-top:12px;white-space:pre-wrap}.good{color:var(--green)}.bad{color:var(--red)}.hide{display:none}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}th{background:#edf3f8;color:var(--navy)}@media(max-width:600px){.grid{grid-template-columns:1fr}.panel{padding:16px}}
</style></head><body><header><div class="wrap"><a href="../">← 返回試算中心</a><h1>創世紀危險保費｜費率管理</h1><div style="font-size:13px;color:#e5eef8">管理者登入後可匯入年度男性／女性費率表</div></div></header><main class="wrap">
<section class="panel" id="loginPanel"><h2>管理者登入</h2><div class="grid"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div></div><button class="btn" id="login">登入</button><div class="msg" id="loginMsg"></div><p class="muted">管理者帳號需先在 Supabase Auth 建立，再將該帳號的 User UID 加入 admin_users 資料表。一般註冊帳號不會自動取得管理權限。</p></section>
<section class="panel hide" id="adminPanel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2 style="margin:0">年度費率管理</h2><button class="btn secondary" id="logout" style="margin:0">登出</button></div><p class="muted">CSV 欄位：rate_year,age,male_rate,female_rate。每個年度需包含 0～99 歲共 100 筆資料。匯入同一年度會更新該年度資料，不會影響其他年度。</p><div class="grid"><div class="field"><label>費率年度（民國）</label><input id="year" type="number" min="1" max="300" value="115"></div><div class="field"><label>選擇 CSV 檔案</label><input id="csv" type="file" accept=".csv,text/csv"></div></div><button class="btn secondary" id="template">下載 CSV 範本</button><button class="btn" id="import">檢查並匯入費率</button><div class="msg" id="importMsg"></div><div style="margin-top:20px"><h2>已建檔年度</h2><div class="tablewrap"><table><thead><tr><th>年度</th><th>年齡筆數</th><th>最後更新</th></tr></thead><tbody id="years"></tbody></table></div></div></section>
</main><script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=id=>document.getElementById(id);let sb=null;function say(id,msg,ok){$(id).textContent=msg;$(id).className='msg '+(ok?'good':'bad')}
function init(){const c=window.SUPABASE_CONFIG||{};if(!c.url||!c.anonKey||c.url.includes('YOUR_')){say('loginMsg','尚未設定 Supabase。請先複製 config.example.js 為 config.js 並填入專案 URL 與 anon key。',false);$('login').disabled=true;return}sb=window.supabase.createClient(c.url,c.anonKey);sb.auth.getSession().then(({data})=>{if(data.session)showAdmin()})}
async function showAdmin(){const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data,error}=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){await sb.auth.signOut();say('loginMsg','此帳號沒有費率管理權限。',false);return}$('loginPanel').classList.add('hide');$('adminPanel').classList.remove('hide');loadYears()}
$('login').onclick=async()=>{say('loginMsg','登入中…',true);const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){say('loginMsg',error.message,false);return}await showAdmin()};$('logout').onclick=async()=>{await sb.auth.signOut();$('adminPanel').classList.add('hide');$('loginPanel').classList.remove('hide')};
async function loadYears(){const {data,error}=await sb.from('genesis_risk_rates').select('rate_year,age,updated_at').order('rate_year').order('age');if(error){say('importMsg',error.message,false);return}const map={};(data||[]).forEach(r=>{let y=Number(r.rate_year);map[y]??={count:0,updated:r.updated_at};map[y].count++;if(r.updated_at>map[y].updated)map[y].updated=r.updated_at});$('years').innerHTML=Object.keys(map).sort((a,b)=>b-a).map(y=>`<tr><td>民國 ${y} 年</td><td>${map[y].count}/100</td><td>${new Date(map[y].updated).toLocaleString('zh-TW')}</td></tr>`).join('')||'<tr><td colspan="3">尚無資料</td></tr>'}
function parseCSV(text){let lines=text.replace(/^\uFEFF/,'').trim().split(/\r?\n/);let headers=lines.shift().split(',').map(x=>x.trim());let idx=['rate_year','age','male_rate','female_rate'].map(k=>headers.indexOf(k));if(idx.some(i=>i<0))throw Error('CSV 標題必須是 rate_year,age,male_rate,female_rate');let arr=lines.filter(x=>x.trim()).map((line,i)=>{let c=line.split(',').map(x=>x.trim());let o={rate_year:Number(c[idx[0]]),age:Number(c[idx[1]]),male_rate:Number(c[idx[2]]),female_rate:Number(c[idx[3]])};if(!Object.values(o).every(Number.isFinite)||o.rate_year<1||o.age<0||o.age>99||o.male_rate<0||o.female_rate<0)throw Error(`第 ${i+2} 列資料格式錯誤`);return o});return arr}
$('template').onclick=()=>{let lines=['rate_year,age,male_rate,female_rate'];for(let a=0;a<=99;a++)lines.push(`${$('year').value},${a},,`);let blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/csv;charset=utf-8'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`創世紀危險保費_${$('year').value}年度範本.csv`;a.click();URL.revokeObjectURL(u)};
$('import').onclick=async()=>{try{let f=$('csv').files[0],y=Number($('year').value);if(!f)throw Error('請先選擇 CSV 檔案。');if(!Number.isInteger(y)||y<1)throw Error('請輸入正確的民國年度。');let arr=parseCSV(await f.text());if(arr.length!==100)throw Error(`目前讀取 ${arr.length} 筆，必須剛好 100 筆（0～99 歲）。`);let seen=new Set();for(const r of arr){if(r.rate_year!==y)throw Error('CSV 的 rate_year 必須與上方年度一致。');if(seen.has(r.age))throw Error(`年齡 ${r.age} 重複。`);seen.add(r.age);if(!Number.isFinite(r.male_rate)||!Number.isFinite(r.female_rate))throw Error(`年齡 ${r.age} 的男女費率不可空白。`)}for(let a=0;a<=99;a++)if(!seen.has(a))throw Error(`缺少年齡 ${a} 歲。`);say('importMsg','資料檢查通過，正在寫入…',true);const payload=arr.map(r=>({...r,updated_at:new Date().toISOString()}));const {error}=await sb.from('genesis_risk_rates').upsert(payload,{onConflict:'rate_year,age'});if(error)throw error;say('importMsg',`匯入成功：民國 ${y} 年，100 筆男女費率已更新。`,true);loadYears()}catch(e){say('importMsg',e.message||String(e),false)}};
init();</script></body></html>
